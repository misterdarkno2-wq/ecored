name: Publicar panel de demostración
# Publica app/static/ en GitHub Pages. Allí el panel no tiene servidor,
# así que js/demo.js muestra datos de ejemplo con un aviso visible.
# Requiere activar una vez: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths: ["app/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/static
      - id: deployment
        uses: actions/deploy-pages@v4
